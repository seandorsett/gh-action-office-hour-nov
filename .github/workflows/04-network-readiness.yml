name: 04 - Multi-cloud and blob readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate report logic
        run: python3 -m unittest discover -s tests -v
      - name: Read current public GitHub Meta API
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api meta > meta.json
      - name: Publish readiness report
        run: python3 scripts/network_report.py meta.json
