name: 02 - Agentic workflow preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check compiled workflows and authentication
        env:
          HAS_COPILOT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
        run: |
          test -f .github/workflows/repo-status.lock.yml
          test -f .github/workflows/issue-triage.lock.yml
          if [ "$HAS_COPILOT_TOKEN" != true ]; then
            echo '::error::Set repository secret COPILOT_GITHUB_TOKEN in GitHub Settings after reviewing Copilot billing and authentication requirements.'
            echo '## Blocked: Copilot authentication is not configured' >> "$GITHUB_STEP_SUMMARY"
            echo 'No AI request was submitted. Do not paste credentials into source, issues or chat.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '## Secret present; validity, entitlement and AI budget still require a real inference run.' >> "$GITHUB_STEP_SUMMARY"
